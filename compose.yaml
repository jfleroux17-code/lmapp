# LMAPP : pile de production sur ld1 (projet Compose « lmapp »).
#
# Règle de sécurité (CLAUDE.md, règle 3) : Docker contourne ufw. Aucun service
# de ce projet ne publie de port. Le HTTPS est servi par Caddy, dans le projet
# « edge » (/srv/lmapp/edge), qui joint l'app par le réseau externe « edge »
# sous le nom lmapp-prod-app.
#
# Les volumes sont « external » : ils sont créés une fois à la main
# (docker volume create) et « docker compose down -v » ne peut pas les effacer.
#
# Migrations : jamais automatiques au démarrage. On les lance à la main :
#   docker compose run --rm app python manage.py migrate

name: lmapp

services:
  db:
    image: postgis/postgis:17-3.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Toronto
      PGTZ: America/Toronto
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - interne
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: lmapp:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      interne:
      edge:
        aliases:
          - lmapp-prod-app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/sante/', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: lmapp:latest
    restart: unless-stopped
    command: ["python", "manage.py", "procrastinate", "worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      - interne
      - sortie
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Surveillance (PRD 6.7) : à part du worker, pour pouvoir signaler un worker bloqué. Voir core/surveillance.py.
  # Réseaux : interne (base), edge (vérifier le site à travers Caddy), sortie (alertes par Twilio et courriel).
  # Aucun port publié. Lit le témoin des sauvegardes en lecture seule.
  surveillance:
    image: lmapp:latest
    restart: unless-stopped
    command: ["python", "manage.py", "surveiller"]
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./sauvegardes:/sauvegardes:ro
    networks:
      - interne
      - edge
      - sortie
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Sauvegarde de la base toutes les 12 heures (PRD K3) : voir outils/sauvegarde_nocturne.sh.
  # Écrit dans /srv/lmapp/sauvegardes, que COVE copie hors de ld1.
  sauvegarde:
    image: postgis/postgis:17-3.7
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/outils/sauvegarde_nocturne.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Toronto
      SAUVEGARDE_HEURES: ${SAUVEGARDE_HEURES:-03:30 15:30}
      SAUVEGARDE_GARDER: ${SAUVEGARDE_GARDER:-28}
    volumes:
      - ./sauvegardes:/sauvegardes
      - ./outils/sauvegarde_nocturne.sh:/outils/sauvegarde_nocturne.sh:ro
    networks:
      - interne
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  # Réseau sans accès Internet : la base n'en sort jamais.
  interne:
    internal: true
  # Réseau partagé avec Caddy (projet edge). Donne aussi à l'app sa sortie
  # vers Internet.
  edge:
    external: true
    name: edge
  # Sortie Internet du worker (Twilio, SMTP2GO, IMAP plus tard), propre à ce
  # projet : le worker n'est pas sur le réseau partagé.
  sortie:

volumes:
  pgdata:
    external: true
    name: lmapp_pgdata
  media:
    external: true
    name: lmapp_media
