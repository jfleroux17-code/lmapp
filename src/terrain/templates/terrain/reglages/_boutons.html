{% if peut %}<div class="sticky bottom-0 -mx-4 grid grid-cols-2 gap-3 border-t border-bordure bg-nuit/95 px-4 py-3 backdrop-blur" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
  <a href="{% url retour %}" class="gros-bouton border-2 border-bordure text-gray-300">Annuler</a>
  <button class="gros-bouton bg-accent text-nuit" :class="{ 'opacity-60': envoi }">Enregistrer</button>
</div>{% else %}<p class="carte p-4 text-sm text-gray-400">Consultation seulement : un administrateur de l'entreprise change les réglages.</p>{% endif %}
