{% extends "terrain/base.html" %}
{% load argent %}
{% block titre %}Rapport de la saison{% endblock %}
{% block tete %}<style>.rapport h3 { margin: 1.25rem 0 .5rem; font-weight: 700; font-size: 1.1rem; } .rapport table { width: 100%; } .rapport td, .rapport th { padding: .45rem .25rem; border-bottom: 1px solid var(--color-bordure); vertical-align: top; } .rapport th { text-align: left; font-size: .8rem; color: var(--color-gray-400); } .rapport .nombre { text-align: right; white-space: nowrap; }</style>{% endblock %}
{% block contenu %}
<a href="{% url 'terrain:comptes' %}" class="mb-3 inline-flex min-h-12 items-center text-accent">‹ Comptes</a>
<h1 class="mb-1 text-2xl font-bold">Saison {{ saison.nom }}</h1>
<form method="get" class="mb-3 flex items-center gap-2">
  <select name="saison" class="champ" onchange="this.form.submit()" aria-label="Saison">
    {% for s in saisons %}<option value="{{ s.pk }}" {% if s.pk == saison.pk %}selected{% endif %}>{{ s.nom }}</option>{% endfor %}
  </select>
</form>
<a href="{% url 'terrain:rapport_saison_pdf' saison.pk %}" class="gros-bouton mb-4 border-2 border-accent text-accent" target="_blank" rel="noopener">Rapport pour le comptable (PDF)</a>
<div class="carte rapport p-4">{% include "facturation/_rapport_saison.html" %}</div>
{% endblock %}
