<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Photos : {{ ent.nom }}</title>
  <style>
    body { margin: 0; background: #f4f4f4; color: #111; font: 18px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    figure { margin: 16px 0; background: #fff; border-radius: 12px; overflow: hidden; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 8px 12px; color: #444; font-size: 0.95rem; }
    p.pied { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <h1>{{ ent.nom }}</h1>
  <p>Photo{{ images|length|pluralize }} envoyée{{ images|length|pluralize }} le {{ m.cree_le|date_qc:"j F Y" }}.</p>
  {% for n, legende in images %}
    <figure><img src="{% url 'photo_message' m.jeton n %}" alt="{{ legende }}" loading="lazy"><figcaption>{{ legende }}</figcaption></figure>
  {% endfor %}
  <p class="pied">{{ ent.nom }}{% if telephone %} · {{ telephone }}{% endif %}</p>
</main>
</body>
</html>
